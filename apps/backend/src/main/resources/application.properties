spring.application.name=study-buddy-matcher
server.port=${SERVER_PORT:8080}

app.api.base-path=/api
app.cors.path-pattern=/api/**
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://127.0.0.1:3000,http://127.0.0.1:4200}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Externalized matching configuration. Tune these for your demo and document the formula.
app.matching.strategy=BALANCED
app.matching.course-weight=40
app.matching.availability-weight=25
app.matching.study-mode-weight=15
app.matching.study-goal-weight=15
app.matching.group-size-weight=5
app.matching.max-results=10

# File-backed H2 keeps application data across restarts. Override for isolated tests.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/studybuddy;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
app.demo.enabled=${DEMO_ENABLED:true}

# Firebase Admin SDK — place serviceAccountKey.json in src/main/resources/ or set FIREBASE_SERVICE_ACCOUNT to an absolute path
app.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT:classpath:StudyBuddy Firebase Service Account.json}
app.firebase.database-url=${FIREBASE_DATABASE_URL:https://studybuddy-b11c6-default-rtdb.firebaseio.com}
